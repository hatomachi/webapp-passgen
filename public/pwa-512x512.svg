<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <g filter="url(#glow)">
    <!-- Shield -->
    <path d="M256 96 C336 96 384 132 384 132 C384 268 256 396 256 396 C256 396 128 268 128 132 C128 132 176 96 256 96 Z" 
          fill="none" 
          stroke="url(#shieldGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Keyhole / Lock Body -->
    <circle cx="256" cy="224" r="32" fill="#38bdf8" />
    <path d="M244 236 L238 296 C238 302 244 308 256 308 C268 308 274 302 274 296 L268 236 Z" fill="#38bdf8" />
  </g>
</svg>
